<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.4;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        li {
            margin-bottom: 8px;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .section-label {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 1.2em;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <input type="text" id="searchInput" placeholder="Search for a game...">

    <div class="section-label" id="recentLabel">Recently Played</div>
    <ul id="recentList"></ul>

    <div class="section-label">All Games</div>
    <ul id="allList"></ul>

    <script>
        const API_URL = 'https://api.github.com/repos/CoolDude2349/Offline-HTML-Games-Pack/git/trees/master?recursive=1';
        let allGames = [];
        let searchTimeout;

        const EXCLUDED_FILES = [
            'single-file.html', 
            'file-input.html', 
            'file-input-minified.html', 
            'epicviewer.htm'
        ];

        function getRecentGames() {
            try {
                const stored = localStorage.getItem('recentGames');
                return stored ? JSON.parse(stored) : [];
            } catch (e) {
                return [];
            }
        }

        function saveRecentGame(gamePath) {
            let recent = getRecentGames();
            recent = recent.filter(path => path !== gamePath);
            recent.unshift(gamePath);
            if (recent.length > 20) {
                recent.pop();
            }
            try {
                localStorage.setItem('recentGames', JSON.stringify(recent));
            } catch (e) {
                console.error("Could not save to localStorage", e);
            }
        }

        function formatGameName(filePath) {
            let parts = filePath.split('/');
            let name = parts.pop().replace(/\.html$/i, '');

            const genericNames = ['index', 'game', 'main', 'play', 'default'];
            if (genericNames.includes(name.toLowerCase()) && parts.length > 0) {
                name = parts.pop();
            }

            let lowerName = name.toLowerCase();

            if (lowerName === 'sm64') return 'Super Mario 64';
            if (lowerName === 'fnaf') return "Five Nights at Freddy's";
            if (lowerName === 'pvz') return 'Plants vs Zombies';

            if (/^(a|b)?\d+(\.\d+)+$/.test(lowerName)) {
                if (lowerName.startsWith('b')) return 'Minecraft Beta ' + lowerName.substring(1);
                if (lowerName.startsWith('a')) return 'Minecraft Alpha ' + lowerName.substring(1);
                return 'Minecraft ' + lowerName;
            }

            return name
                .replace(/[-_]+/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        function renderGames(filterText = '') {
            const recentListEl = document.getElementById('recentList');
            const allListEl = document.getElementById('allList');
            const recentLabel = document.getElementById('recentLabel');
            
            recentListEl.innerHTML = '';
            allListEl.innerHTML = '';

            const lowerFilter = filterText.toLowerCase();
            const recentPaths = getRecentGames();

            if (filterText === '' && recentPaths.length > 0) {
                recentLabel.style.display = 'block';
                recentPaths.forEach(path => {
                    const game = allGames.find(g => g.path === path);
                    if (game) {
                        recentListEl.appendChild(createListItem(game));
                    }
                });
            } else {
                recentLabel.style.display = 'none';
            }

            allGames.forEach(game => {
                if (game.name.toLowerCase().includes(lowerFilter) || game.path.toLowerCase().includes(lowerFilter)) {
                    allListEl.appendChild(createListItem(game));
                }
            });
        }

        function createListItem(game) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            
            // FIX 1: Removed 'offline/' prefix
            // FIX 2: URL-encoded each part of the path so spaces/special characters don't break the link
            a.href = game.path.split('/').map(part => encodeURIComponent(part)).join('/');
            
            a.textContent = game.name;
            
            a.addEventListener('click', () => {
                saveRecentGame(game.path);
            });

            li.appendChild(a);
            return li;
        }

        async function fetchGames() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                if (data && data.tree) {
                    allGames = data.tree
                        .filter(item => {
                            if (item.type !== 'blob') return false;
                            if (!item.path.toLowerCase().endsWith('.html')) return false;
                            if (item.path.includes('inline-tools/')) return false;
                            
                            const filename = item.path.split('/').pop();
                            if (EXCLUDED_FILES.includes(filename)) return false;
                            
                            return true;
                        })
                        .map(item => {
                            return {
                                path: item.path,
                                name: formatGameName(item.path)
                            };
                        });
                    
                    allGames.sort((a, b) => a.name.localeCompare(b.name));
                    renderGames();
                }
            } catch (error) {
                document.getElementById('allList').innerHTML = '<li>Error loading games list.</li>';
                console.error("Fetch error:", error);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderGames(e.target.value.trim());
            }, 300);
        });

        fetchGames();
    </script>
</body>
</html>
