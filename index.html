<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.4;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
        }
        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        li {
            margin-bottom: 5px;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .section-label {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <input type="text" id="searchInput" placeholder="Search...">

    <div class="section-label">Recently Played</div>
    <ul id="recentList"></ul>

    <div class="section-label">All Games</div>
    <ul id="allList"></ul>

    <script>
        const API_URL = 'https://api.github.com/repos/CoolDude2349/Offline-HTML-Games-Pack/git/trees/master?recursive=1';
        let allGames = [];
        let searchTimeout;

        const EXCLUDED_FILES = [
            'single-file.html', 
            'file-input.html', 
            'file-input-minified.html', 
            'epicviewer.htm'
        ];

        function getRecentGames() {
            const cookieString = document.cookie.split('; ').find(row => row.startsWith('recentGames='));
            if (cookieString) {
                try {
                    return JSON.parse(decodeURIComponent(cookieString.split('=')[1]));
                } catch (e) {
                    return [];
                }
            }
            return [];
        }

        function saveRecentGame(filename) {
            let recent = getRecentGames();
            recent = recent.filter(game => game !== filename);
            recent.unshift(filename);
            if (recent.length > 20) {
                recent.pop();
            }
            document.cookie = `recentGames=${encodeURIComponent(JSON.stringify(recent))}; path=/; max-age=31536000`; // 1 year expiration
        }

        function formatGameName(filename) {
            let name = filename.replace(/\.html$/i, '');
            let lowerName = name.toLowerCase();

            // Handle specific overrides
            if (lowerName === 'sm64') return 'Super Mario 64';
            if (lowerName === 'fnaf') return "Five Nights at Freddy's";
            if (lowerName === 'pvz') return 'Plants vs Zombies';

            // Handle Minecraft versions (e.g., 1.3, 1.5.2, b1.7.3, a1.2.6)
            if (/^(a|b)?\d+(\.\d+)+$/.test(lowerName)) {
                if (lowerName.startsWith('b')) return 'Minecraft Beta ' + lowerName.substring(1);
                if (lowerName.startsWith('a')) return 'Minecraft Alpha ' + lowerName.substring(1);
                return 'Minecraft ' + lowerName;
            }

            // Remove dashes/underscores and capitalize words
            return name
                .replace(/[-_]+/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        function renderGames(filterText = '') {
            const recentListEl = document.getElementById('recentList');
            const allListEl = document.getElementById('allList');
            
            recentListEl.innerHTML = '';
            allListEl.innerHTML = '';

            const lowerFilter = filterText.toLowerCase();
            const recentFilenames = getRecentGames();

            // Render Recent Games
            if (filterText === '') {
                recentFilenames.forEach(filename => {
                    const game = allGames.find(g => g.filename === filename);
                    if (game) {
                        recentListEl.appendChild(createListItem(game));
                    }
                });
            } else {
                const recentLabel = recentListEl.previousElementSibling;
                recentLabel.style.display = 'none';
            }

            // Render All Games
            allGames.forEach(game => {
                if (game.name.toLowerCase().includes(lowerFilter) || game.filename.toLowerCase().includes(lowerFilter)) {
                    allListEl.appendChild(createListItem(game));
                }
            });

            // Toggle Recent label visibility
            if (filterText === '') {
                recentListEl.previousElementSibling.style.display = 'block';
            }
        }

        function createListItem(game) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = `offline/${game.filename}`;
            a.textContent = game.name;
            
            a.addEventListener('click', (e) => {
                e.preventDefault();
                saveRecentGame(game.filename);
                window.location.href = a.href;
            });

            li.appendChild(a);
            return li;
        }

        async function fetchGames() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                if (data && data.tree) {
                    allGames = data.tree
                        .filter(item => {
                            // Must be a file, end with .html, not be in inline-tools, and not be in excluded list
                            if (item.type !== 'blob') return false;
                            if (!item.path.toLowerCase().endsWith('.html')) return false;
                            if (item.path.includes('inline-tools/')) return false;
                            
                            const filename = item.path.split('/').pop();
                            if (EXCLUDED_FILES.includes(filename)) return false;
                            
                            return true;
                        })
                        .map(item => {
                            const filename = item.path.split('/').pop();
                            return {
                                filename: filename,
                                name: formatGameName(filename)
                            };
                        });
                    
                    // Sort alphabetically
                    allGames.sort((a, b) => a.name.localeCompare(b.name));
                    renderGames();
                }
            } catch (error) {
                document.getElementById('allList').innerHTML = '<li>Error loading games list.</li>';
                console.error("Fetch error:", error);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderGames(e.target.value.trim());
            }, 300); // Simple debounce
        });

        // Init
        fetchGames();
    </script>
</body>
</html>
