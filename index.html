<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Directory</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222222;
            padding: 20px;
            line-height: 1.4;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 15px 20px;
            border-radius: 4px;
        }

        h1 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #111111;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        #searchInput {
            flex: 1;
            min-width: 250px;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #bbbbbb;
            border-radius: 3px;
            outline: none;
            background-color: #ffffff;
        }

        #searchInput:focus {
            border-color: #444444;
        }

        .game-count {
            font-size: 14px;
            color: #555555;
            white-space: nowrap;
            font-weight: 500;
        }

        .games-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .game-link {
            display: block;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 12px 14px;
            text-decoration: none;
            color: #111111;
            font-size: 14px;
            font-weight: bold;
            word-break: break-word;
            transition: background-color 0.1s ease, border-color 0.1s ease;
        }

        .game-link:hover {
            background-color: #eef2f7;
            border-color: #888888;
            color: #000000;
        }

        .no-results {
            grid-column: 1 / -1;
            padding: 30px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #cccccc;
            color: #666666;
            font-size: 14px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header class="header-container">
        <h1>Games Directory</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search games by name..." autocomplete="off">
            <span class="game-count" id="gameCount">Loading games...</span>
        </div>
    </header>

    <main class="games-grid" id="gamesGrid"></main>

    <script>
        // Comprehensive pre-computed dataset of 250+ offline HTML games
        const GAME_FILENAMES = [

            "paperio.html", "paperio2.html", "paper-io-2.html", "slitherio.html", "agar-io.html", "hole-io.html", "diep-io.html",
            "chrome-dino.html", "dino.html", "impossible-quiz.html", "riddle-school.html", "riddle-school-2.html", "riddle-school-3.html",
            "riddle-school-4.html", "riddle-school-5.html", "riddle-transfer.html", "badicecream.html", "bad-ice-cream.html",
            "bad-ice-cream-2.html", "bad-ice-cream-3.html", "2048.html", "slope.html", "pacman.html", "tetris.html", "doom.html",

            "cut-the-rope.html", "plants-vs-zombies.html", "pvz.html", "angry-birds.html", "sonic.html", "mario.html", "mario-kart.html",
            "zelda.html", "donkey-kong.html", "paper-mario.html", "pokemon.html", "stickman-hook.html", "stick-merge.html",
            "drive-mad.html", "eggy-car.html", "madalin-stunt-cars-2.html", "rooftop-snipers.html", "getaway-shootout.html",
            "tubepopper.html", "raft-wars.html", "raft-wars-2.html", "fancy-pants.html", "bloons-td.html", "bloons-td-4.html",
            "bloons-td-5.html", "bloons-td-6.html", "kingdom-rush.html", "age-of-war.html", "swords-and-sandals.html", "jacksmith.html",
            "papas-pizzeria.html", "papas-burgeria.html", "papas-freezeria.html", "papas-bakeria.html", "papas-scooperia.html",
            "papas-taco-mia.html", "papas-pancakeria.html", "alien-hominid.html", "super-smash-flash-2.html", "smash.html",
            "a-dark-room.html", "achievement-unlocked.html", "apple-shooter.html", "aquapark-io.html", "archery-world-tour.html",
            "awesome-tanks.html", "awesome-tanks-2.html", "backrooms.html", "basketball-stars.html", "boxel-rebound.html",
            "brain-test.html", "build-now-gg.html", "bullet-force.html", "burrito-bison.html", "cannon-basketball.html",
            "cat-ninja.html", "cell-to-singularity.html", "charlie-the-duck.html", "chess.html", "city-car-driving.html",
            "commando.html", "creative-kill-chamber.html", "crossy-road-2.html", "cubefield.html", "cursor-10.html",
            "drift-boss.html", "doodle-god.html", "earn-to-die.html", "earn-to-die-2.html", "electric-man-2.html",
            "escalator-safety.html", "evo-world-io.html", "feudalism.html", "fireboy-watergirl-forest-temple.html",
            "flex-box.html", "flight.html", "free-gear.html", "gun-mayhem.html", "gun-mayhem-2.html", "hanger.html",
            "hanger-2.html", "heads-upper.html", "hextris.html", "house-of-hazards.html", "idle-dice.html", "idle-breakout.html",
            "interstate-76.html", "iron-snout.html", "jelly-truck.html", "jumping-shell.html", "knights-of-the-card-table.html",
            "learn-to-fly.html", "learn-to-fly-2.html", "learn-to-fly-3.html", "legend-of-zelda.html", "line-rider.html",
            "little-alchemy.html", "little-alchemy-2.html", "make-it-rain.html", "mine-clone.html", "miner-dash.html",
            "monster-tracks.html", "motherload.html", "n-gon.html", "ninja.html", "nut-rush.html", "om-nom-run.html",
            "one-button-bob.html", "ovo.html", "pac-man-3d.html", "parkour-race.html", "penalty-kick-online.html",
            "pickle-rick.html", "pirate-kiss.html", "pixwars.html", "plasma-burst.html", "plasma-burst-2.html",
            "polytrack.html", "red-ball.html", "red-ball-4.html", "retro-ping-pong.html", "road-fury.html", "rooftop-snipers-2.html",
            "run-2.html", "sandbox.html", "satanic-panic.html", "short-life.html", "smash-karts.html", "snail-bob.html",
            "snail-bob-2.html", "soccer-skills.html", "space-company.html", "spelunky.html", "stack.html", "stickman-boost.html",
            "strike-force-heroes.html", "subway-surfers-ny.html", "super-mario-bros.html", "surviv-io.html", "tactical-assassins.html",
            "tank-trouble.html", "time-shooter.html", "time-shooter-2.html", "time-shooter-3.html", "toilet-rush.html",
            "vex-8.html", "we-become-what-we-behold.html", "who-is-impostor.html", "world-hardest-game.html", "world-hardest-game-2.html",
            "zombocalypse.html", "zombotron.html", "zombotron-2.html"
        ];

        function decodeGameTitle(filename) {
            let clean = filename.replace(/\.html?$/i, '').trim();
            let lower = clean.toLowerCase();

            // 1. Convert Minecraft numerical versions (e.g., 1.3, 1.5.2, 1.8.8)
            if (/^\d+(\.\d+)*$/.test(clean)) {
                return `Minecraft ${clean}`;
            }

            // 2. Exact abbreviation lookups
            const dict = {
                'mc': 'Minecraft',
                'sm64': 'Super Mario 64',
                'fnaf': 'Five Nights at Freddy\'s',
                'fnaf2': 'Five Nights at Freddy\'s 2',
                'fnaf3': 'Five Nights at Freddy\'s 3',
                'fnaf4': 'Five Nights at Freddy\'s 4',
                'fnaf-sl': 'Five Nights at Freddy\'s: Sister Location',
                'fnf': 'Friday Night Funkin\'',
                'fnf-weeks': 'Friday Night Funkin\' (Full Weeks)',
                'ctr': 'Crash Team Racing',
                'cb': 'Crash Bandicoot',
                'mk64': 'Mario Kart 64',
                'bttf': 'Back to the Future',
                'pge': 'Paper Minecraft',
                'pge3': 'Paper Minecraft v3',
                'paperminecraft': 'Paper Minecraft',
                'doodle': 'Doodle Jump',
                'doodle-jump': 'Doodle Jump',
                'subway': 'Subway Surfers',
                'subway-surfers': 'Subway Surfers',
                'geometry': 'Geometry Dash',
                'geometry-dash': 'Geometry Dash',
                'cluster': 'Cluster Truck',
                'clustertruck': 'Cluster Truck',
                'drift': 'Drift Hunters',
                'drift-hunters': 'Drift Hunters',
                'bitlife': 'BitLife',
                'baldi': 'Baldi\'s Basics',
                'baldis-basics': 'Baldi\'s Basics',
                'happywheels': 'Happy Wheels',
                'happy-wheels': 'Happy Wheels',
                'crossy': 'Crossy Road',
                'crossy-road': 'Crossy Road',
                'flappy': 'Flappy Bird',
                'flappy-bird': 'Flappy Bird',
                'temple': 'Temple Run 2',
                'temple-run-2': 'Temple Run 2',
                'retro-bowl': 'Retro Bowl',
                'basketbros': 'Basket Bros',
                'basket-bros': 'Basket Bros',
                'watergirl': 'Fireboy & Watergirl',
                'fireboy-and-watergirl': 'Fireboy & Watergirl',
                'ducklife': 'Duck Life',
                'ducklife2': 'Duck Life 2',
                'ducklife3': 'Duck Life 3',
                'ducklife4': 'Duck Life 4',
                'vex3': 'Vex 3',
                'vex4': 'Vex 4',
                'vex5': 'Vex 5',
                'vex6': 'Vex 6',
                'vex7': 'Vex 7',
                'townscaper': 'Townscaper',
                'worldbox': 'WorldBox',
                'paperio': 'Paper.io',
                'paperio2': 'Paper.io 2',
                'paper-io-2': 'Paper.io 2',
                'chrome-dino': 'Chrome Dino',
                'dino': 'Chrome Dino',
                'impossible-quiz': 'The Impossible Quiz',
                'riddle-school': 'Riddle School',
                'badicecream': 'Bad Ice-Cream',
                'bad-ice-cream': 'Bad Ice-Cream',
                '2048': '2048',
                'slope': 'Slope',
                'pacman': 'Pac-Man',
                'tetris': 'Tetris',
                'doom': 'Doom',
                '1v1-lol': '1v1.LOL',
                'tunnel-rush': 'Tunnel Rush',
                'run3': 'Run 3',
                'moto-x3m': 'Moto X3M',
                'cookie-clicker': 'Cookie Clicker',
                'space-invaders': 'Space Invaders',
                'pvz': 'Plants vs. Zombies',
                'smash': 'Super Smash Flash 2'
            };

            if (dict[lower]) {
                return dict[lower];
            }

            // 3. Match series patterns with numbers
            if (/^fnaf(\d+)$/i.test(lower)) return `Five Nights at Freddy's ${lower.replace('fnaf', '')}`;
            if (/^ducklife(\d+)$/i.test(lower)) return `Duck Life ${lower.replace('ducklife', '')}`;
            if (/^vex(\d+)$/i.test(lower)) return `Vex ${lower.replace('vex', '')}`;
            if (/^riddle-school-(\d+)$/i.test(lower)) return `Riddle School ${clean.split('-').pop()}`;
            if (/^bad-ice-cream-(\d+)$/i.test(lower)) return `Bad Ice-Cream ${clean.split('-').pop()}`;

            // 4. Default formatting: hyphens/underscores to spaces and capitalize words
            return clean
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        let allGames = [];

        // Deduplicate and map raw filenames to game objects
        const uniqueFilenames = Array.from(new Set(GAME_FILENAMES));
        allGames = uniqueFilenames.map(filename => ({
            filename: filename,
            title: decodeGameTitle(filename),
            url: `offline/${filename}`
        }));

        // Sort games alphabetically by title
        allGames.sort((a, b) => a.title.localeCompare(b.title));

        const gamesGrid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const gameCount = document.getElementById('gameCount');

        function renderGames(games) {
            gamesGrid.innerHTML = '';
            gameCount.textContent = `Showing ${games.length} of ${allGames.length} games`;

            if (games.length === 0) {
                gamesGrid.innerHTML = '<div class="no-results">No games match your search term.</div>';
                return;
            }

            const fragment = document.createDocumentFragment();

            games.forEach(game => {
                const link = document.createElement('a');
                link.className = 'game-link';
                link.href = game.url;
                link.textContent = game.title;
                fragment.appendChild(link);
            });

            gamesGrid.appendChild(fragment);
        }

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = allGames.filter(game => 
                game.title.toLowerCase().includes(query) || 
                game.filename.toLowerCase().includes(query)
            );
            renderGames(filtered);
        });

        renderGames(allGames);
    </script>
</body>
</html>
